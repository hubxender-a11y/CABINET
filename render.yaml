services:
  - type: web
    name: factura-rdc-api
    runtime: node
    plan: free
    rootDir: backend
    autoDeployTrigger: off
    buildCommand: >-
      export APP_DATABASE_URL="$DATABASE_URL" &&
      export DATABASE_URL="${DATABASE_URL/pooled.db.prisma.io/db.prisma.io}" &&
      npm install --include=dev --no-audit --no-fund &&
      npm run db:generate &&
      npm run db:deploy &&
      export DATABASE_URL="$APP_DATABASE_URL" &&
      npm run build &&
      npm prune --omit=dev
    startCommand: npm run start:prod
    healthCheckPath: /api/auth/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.16.0
      - key: DEFAULT_COMPANY_ID
        value: 5eecf1f8-a90e-4e8f-a01b-6eaa7a7c8e20
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_CALLBACK_URL
        value: https://factura-rdc-api.onrender.com/api/mail-settings/google/callback
      - key: APP_WEB_URL
        value: https://facture-rdc.vercel.app
      - key: EMAIL_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: OP_EMAIL_PROVIDER
        value: gmail
      - key: GMAIL_USER
        value: xenderhub@gmail.com
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        value: service@ctrs.cd
      - key: PLATFORM_ADMIN_EMAIL
        value: contact@ctrs.cd
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: OP_EMAIL_FROM
        sync: false
