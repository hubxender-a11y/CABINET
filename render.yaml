services:
  - type: web
    name: factura-rdc-api
    runtime: node
    plan: free
    rootDir: backend
    autoDeployTrigger: off
    buildCommand: npm install --include=dev --no-audit --no-fund && npm run db:generate && npm run build && npm prune --omit=dev
    startCommand: npm run start:prod
    healthCheckPath: /api/auth/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.16.0
      - key: DEFAULT_COMPANY_ID
        value: 5eecf1f8-a90e-4e8f-a01b-6eaa7a7c8e20
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
      - key: ADMIN_EMAIL
        value: service@ctrs.cd
      - key: ADMIN_PASSWORD
        generateValue: true
